! Startup config for Arista cEOS (Implementation A) - enables eAPI so NAPALM's EOS driver can connect
hostname lab-switch
username admin privilege 15 role network-admin secret labpassword
!
service routing protocols model multi-agent
!
management api http-commands
   protocol https
   no shutdown
!
interface Ethernet1
   description baseline
   no switchport
   no shutdown
!
end
